name: Sync an existing release to Vercel Blob

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing complete release with release-manifest.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blob-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          omit-dev: 'true'

      - name: Download all eight platform packages and release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p release-published
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir release-published \
            --pattern '*-Windows-*.exe' --pattern '*-Linux-*.AppImage' \
            --pattern '*-macOS-*.zip' --pattern 'release-manifest.json'
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" \
            --json tagName,name,url,body,publishedAt > release-published/release.json

      - name: Verify all platform packages and publish Blob latest
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-release-to-blob.mjs release-published "${{ inputs.tag }}" release-published/release.json
