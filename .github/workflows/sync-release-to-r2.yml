name: Sync an existing release to Cloudflare R2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing complete release with release-manifest.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: blob-release-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-toolchain
        with:
          omit-dev: 'true'

      - name: Download all eight platform packages and release manifest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          mkdir -p release-published
          gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir release-published \
            --pattern '*-Windows-*.exe' --pattern '*-Linux-*.AppImage' \
            --pattern '*-macOS-*.zip' --pattern 'release-manifest.json' \
            --pattern 'patch-manifest.json*' --pattern 'patch-*'
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" \
            --json tagName,name,url,body,publishedAt > release-published/release.json

      - name: Verify all platform packages and publish R2 latest
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/sync-release-to-r2.mjs release-published "$RELEASE_TAG" release-published/release.json
