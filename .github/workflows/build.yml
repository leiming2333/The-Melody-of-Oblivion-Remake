name: Build & Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            arch: x64
            pattern: release/*.exe
          - os: windows-latest
            script: build:win
            arch: ia32
            pattern: release/*.exe
          - os: windows-latest
            script: build:win
            arch: arm64
            pattern: release/*.exe
          - os: ubuntu-latest
            script: build:linux
            arch: x64
            pattern: release/*.AppImage
          - os: ubuntu-latest
            script: build:linux
            arch: arm64
            pattern: release/*.AppImage
          - os: ubuntu-latest
            script: build:linux
            arch: armv7l
            pattern: release/*.AppImage
          - os: macos-latest
            script: build:mac
            arch: x64
            pattern: release/*.zip
          - os: macos-latest
            script: build:mac
            arch: arm64
            pattern: release/*.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate source
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Build (${{ matrix.arch }})
        run: npm run ${{ matrix.script }} -- --${{ matrix.arch }}

      - name: Normalize Linux x64 artifact name
        if: matrix.script == 'build:linux' && matrix.arch == 'x64'
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          mv "release/The-Melody-of-Oblivion-Remake-v${version}-Linux-x86_64.AppImage" \
             "release/The-Melody-of-Oblivion-Remake-v${version}-Linux-x64.AppImage"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dist-*

      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if ! gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            notes_file=".github/notes/${{ github.ref_name }}.md"
            if [ -f "$notes_file" ]; then
              gh release create "${{ github.ref_name }}" --draft --notes-file "$notes_file"
            else
              gh release create "${{ github.ref_name }}" --draft --generate-notes
            fi
          fi
          find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' \) -print0 \
            | xargs -0 -r -n1 gh release upload "${{ github.ref_name }}" --clobber
          gh release edit "${{ github.ref_name }}" --draft=false
