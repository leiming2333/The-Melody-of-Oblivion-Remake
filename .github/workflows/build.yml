name: Build & Release
permissions:
  contents: read
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - id: matrix
        run: node scripts/ci-matrix.cjs
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: node -e "require('./scripts/release-assets.cjs').assertTag(process.env.GITHUB_REF_NAME, require('./package.json').version)"
  build:
    needs: targets
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: npm run check
      - run: npm test
      - name: Build isolated package
        run: npm run build -- --target ${{ matrix.id }}
        env:
          MELODY_MICROSOFT_CLIENT_ID: ${{ secrets.MELODY_MICROSOFT_CLIENT_ID || '72867f11-f8bf-4086-a502-39039a08970c' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.output }}/${{ matrix.filename }}
            ${{ matrix.output }}/build-metadata.json
          if-no-files-found: error
          compression-level: 0
  smoke:
    name: Verify final packages and upgrades
    needs: [targets, build]
    uses: ./.github/workflows/release-smoke.yml
    with:
      matrix: ${{ needs.targets.outputs.smoke }}
  assemble:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          omit-dev: 'true'
          skip-electron: 'true'
      - uses: actions/download-artifact@v4
        with:
          path: release-input
          pattern: dist-*
      - uses: actions/download-artifact@v4
        with:
          path: smoke-input
          pattern: smoke-*
      - name: Verify complete asset set and build manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then export RELEASE_TAG=$(node -p "'v' + require('./package.json').version"); fi
          node scripts/release-assets.cjs release-input release-verified smoke-input
      - name: Find previous stable release for delta patches
        if: github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json isDraft,assets \
            > "$RUNNER_TEMP/current-release.json" 2>/dev/null; then
            if ! jq -e '.isDraft == true' "$RUNNER_TEMP/current-release.json" >/dev/null; then
              if jq -e '[.assets[].name] | index("patch-manifest.json")' "$RUNNER_TEMP/current-release.json" >/dev/null; then
                gh release download "$RELEASE_TAG" --repo "$GH_REPO" --dir release-verified \
                  --pattern 'patch-manifest.json*' --pattern 'patch-*'
              fi
              echo '::notice::A published release already exists; skipping delta regeneration.'
              exit 0
            fi
          fi
          PREVIOUS_RELEASES=$(gh api "repos/$GH_REPO/releases?per_page=30" \
            --jq "[.[] | select(.draft == false and .prerelease == false and .tag_name != \"$RELEASE_TAG\")][0:3] | .[].tag_name")
          if [ -z "$PREVIOUS_RELEASES" ]; then
            echo '::notice::No previous stable release; publishing full packages only.'
            exit 0
          fi
          while IFS= read -r previous; do
            [ -z "$previous" ] && continue
            mkdir -p "previous-release/$previous"
            gh release download "$previous" --repo "$GH_REPO" --dir "previous-release/$previous" \
              --pattern '*-Windows-*.exe' --pattern '*-Linux-*.AppImage' \
              --pattern '*-macOS-*.zip' --pattern 'release-manifest.json'
          done <<< "$PREVIOUS_RELEASES"
      - name: Generate and verify delta patches
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d previous-release ] || [ -z "$(find previous-release -mindepth 1 -maxdepth 1 -type d -print -quit)" ]; then
            echo '::notice::No previous stable release; publishing full packages only.'
            exit 0
          fi
          ARCHIVE="$RUNNER_TEMP/zig-bsdiff.tar.gz"
          curl -fsSL --retry 8 --retry-all-errors --connect-timeout 20 --max-time 180 \
            -o "$ARCHIVE" https://github.com/blackboardsh/zig-bsdiff/releases/download/v0.1.26/zig-bsdiff-linux-x64.tar.gz
          echo 'e417735e3373c6660789216638bd847c7fba49a96d8770968a0b438e6587bd57  '"$ARCHIVE" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/zig-bsdiff"
          tar -xzf "$ARCHIVE" -C "$RUNNER_TEMP/zig-bsdiff"
          BIN=$(find "$RUNNER_TEMP/zig-bsdiff" -type f -name bsdiff | head -n 1)
          test -n "$BIN"
          chmod +x "$BIN"
          ZIG_BSDIFF="$BIN" node scripts/build-patches.cjs release-verified previous-release
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundle
          path: release-verified/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  release:
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    concurrency:
      group: blob-release-sync
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          omit-dev: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: release-published
      - name: Publish verified draft or verify immutable existing release
        run: node scripts/publish-release.cjs release-published
      - name: Sync all eight verified packages to R2, with Blob fallback
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID || vars.R2_ACCOUNT_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME || vars.R2_BUCKET_NAME }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_PUBLIC_BASE_URL: ${{ secrets.R2_PUBLIC_BASE_URL || vars.R2_PUBLIC_BASE_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET_NAME" ] && [ -n "$R2_ACCESS_KEY_ID" ] && [ -n "$R2_SECRET_ACCESS_KEY" ] && [ -n "$R2_PUBLIC_BASE_URL" ]; then
            gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName,name,url,body,publishedAt > release-published/release.json
            node scripts/sync-release-to-r2.mjs release-published "$RELEASE_TAG" release-published/release.json
          elif [ -n "$BLOB_READ_WRITE_TOKEN" ]; then
            echo '::notice::R2 synchronization is not configured; using Blob fallback.'
            gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName,name,url,body,publishedAt > release-published/release.json
            node scripts/sync-release-to-blob.mjs release-published "$RELEASE_TAG" release-published/release.json
          else
            echo '::notice::R2 and Blob synchronization are not configured; skipping object storage synchronization. GitHub assets are published.'
            exit 0
          fi
