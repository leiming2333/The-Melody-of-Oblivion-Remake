name: Build & Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            arch: x64
            pattern: release/*.exe
          - os: windows-latest
            script: build:win
            arch: ia32
            pattern: release/*.exe
          - os: windows-latest
            script: build:win
            arch: arm64
            pattern: release/*.exe
          - os: ubuntu-latest
            script: build:linux
            arch: x64
            pattern: release/*.AppImage
          - os: ubuntu-latest
            script: build:linux
            arch: arm64
            pattern: release/*.AppImage
          - os: ubuntu-latest
            script: build:linux
            arch: armv7l
            pattern: release/*.AppImage
          - os: macos-latest
            script: build:mac
            arch: x64
            pattern: release/*.zip
          - os: macos-latest
            script: build:mac
            arch: arm64
            pattern: release/*.zip
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (${{ matrix.arch }})
        run: npm run ${{ matrix.script }} -- --${{ matrix.arch }}
        env:
          MELODY_MICROSOFT_CLIENT_ID: ${{ secrets.MELODY_MICROSOFT_CLIENT_ID }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}-${{ matrix.arch }}
          path: ${{ matrix.pattern }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          pattern: dist-*

      - name: Clear stale release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release view "${{ github.ref_name }}" --json assets -q '.assets[].id' 2>/dev/null | while read -r id; do
            echo "deleting asset $id"
            gh api -X DELETE "/repos/${{ github.repository }}/releases/assets/$id"
          done || true

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -x
          echo "== files found =="
          find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' \)
          gh release view "${{ github.ref_name }}" --json id -q .id || gh release create "${{ github.ref_name }}" --generate-notes
          find release-assets -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.AppImage' \) -print0 \
            | xargs -0 -r -n1 gh release upload "${{ github.ref_name }}" --clobber
