name: Build & Release
permissions:
  contents: read
on:
  push:
    tags: ['v*']
  workflow_dispatch:
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      build: ${{ steps.matrix.outputs.build }}
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - id: matrix
        run: node scripts/ci-matrix.cjs
      - name: Verify release tag
        if: github.ref_type == 'tag'
        run: node -e "require('./scripts/release-assets.cjs').assertTag(process.env.GITHUB_REF_NAME, require('./package.json').version)"
  build:
    needs: targets
    name: Build ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.build) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: npm run check
      - run: npm test
      - name: Build isolated package
        run: npm run build -- --target ${{ matrix.id }}
        env:
          MELODY_MICROSOFT_CLIENT_ID: ${{ secrets.MELODY_MICROSOFT_CLIENT_ID || '72867f11-f8bf-4086-a502-39039a08970c' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.output }}/${{ matrix.filename }}
            ${{ matrix.output }}/build-metadata.json
          if-no-files-found: error
          compression-level: 0
  smoke:
    name: Verify final packages and upgrades
    needs: [targets, build]
    uses: ./.github/workflows/release-smoke.yml
    with:
      matrix: ${{ needs.targets.outputs.smoke }}
  assemble:
    needs: [build, smoke]
    runs-on: ubuntu-24.04
    env:
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - uses: actions/download-artifact@v4
        with:
          path: release-input
          pattern: dist-*
      - uses: actions/download-artifact@v4
        with:
          path: smoke-input
          pattern: smoke-*
      - name: Verify complete asset set and build manifest
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then export RELEASE_TAG=$(node -p "'v' + require('./package.json').version"); fi
          node scripts/release-assets.cjs release-input release-verified smoke-input
      - uses: actions/upload-artifact@v4
        with:
          name: verified-release-bundle
          path: release-verified/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
  release:
    if: github.ref_type == 'tag'
    needs: assemble
    runs-on: ubuntu-24.04
    concurrency:
      group: blob-release-sync
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
        with:
          omit-dev: 'true'
      - uses: actions/download-artifact@v4
        with:
          name: verified-release-bundle
          path: release-published
      - name: Publish verified draft or verify immutable existing release
        run: node scripts/publish-release.cjs release-published
      - name: Sync all verified packages before changing Blob latest
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then
            echo '::notice::Blob synchronization is not configured; GitHub assets are published.'
            exit 0
          fi
          gh release view "$RELEASE_TAG" --repo "$GH_REPO" --json tagName,name,url,body,publishedAt > release-published/release.json
          node scripts/sync-release-to-blob.mjs release-published "$RELEASE_TAG" release-published/release.json
