name: Verify release packages
on:
  workflow_call:
    inputs:
      matrix:
        required: true
        type: string
permissions:
  contents: read
jobs:
  smoke:
    name: Final package ${{ matrix.id }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.output }}
      - uses: ./.github/actions/package-smoke
        with:
          target: ${{ matrix.id }}
          arch: ${{ matrix.arch }}
          artifact: ${{ matrix.output }}/${{ matrix.filename }}
          emulated: ${{ matrix.emulated }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.id }}
          path: package-reports
          if-no-files-found: warn
          retention-days: 30
