name: Native package smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'build/**'
      - 'package*.json'
      - '.node-version'
      - '.github/workflows/**'
      - '.github/actions/**'
permissions:
  contents: read
jobs:
  targets:
    runs-on: ubuntu-24.04
    outputs:
      smoke: ${{ steps.matrix.outputs.smoke }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.10.0
      - id: matrix
        run: node scripts/ci-matrix.cjs
  smoke:
    needs: targets
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.targets.outputs.smoke) }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-toolchain
      - run: npm run build -- --target ${{ matrix.id }}
      - uses: ./.github/actions/package-smoke
        with:
          target: ${{ matrix.id }}
          arch: ${{ matrix.arch }}
          artifact: ${{ matrix.output }}/${{ matrix.filename }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-${{ matrix.id }}
          path: package-reports
          if-no-files-found: warn
          retention-days: 14
