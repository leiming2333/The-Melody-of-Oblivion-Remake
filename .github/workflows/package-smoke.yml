name: Native package smoke
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/verify-packaged.cjs'
      - 'package*.json'
      - '.github/workflows/package-smoke.yml'
      - '.github/workflows/build.yml'
      - '.github/workflows/release-smoke.yml'
      - '.github/actions/package-smoke/**'
permissions:
  contents: read
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            arch: x64
          - os: ubuntu-latest
            script: build:linux
            arch: x64
          - os: macos-15-intel
            script: build:mac
            arch: x64
          - os: macos-15
            script: build:mac
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run ${{ matrix.script }} -- --${{ matrix.arch }}
        env:
          MELODY_MICROSOFT_CLIENT_ID: '72867f11-f8bf-4086-a502-39039a08970c'
      - uses: ./.github/actions/package-smoke
        with:
          arch: ${{ matrix.arch }}
